name: CD - Build and Deploy

on:
  workflow_run:
    workflows: [ "CI - Lint and Test" ]
    types: [ completed ]
    branches: [ main ]

# One deployment at a time. Queue rather than cancel: an interrupted run would
# leave a half-finished rollout on the service.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: credit-risk-api
  ECS_SERVICE: credit-risk-task-service-d1oa9itj
  ECS_CLUSTER: credit-risk-cluster
  ECS_TASK_DEFINITION: credit-risk-task
  CONTAINER_NAME: credit-risk-api
  CONTAINER_PORT: 8000

jobs:
  # Build, verification and push share a job on purpose: the image that reaches
  # ECR has to be the exact one the verification step exercised. Rebuilding in a
  # second job pushed bytes nobody had run a prediction against.
  build-verify-deploy:
    name: Build, Verify & Deploy
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      # workflow_run runs against the default branch by default, so the ref has
      # to be pinned to the commit CI actually validated.
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version from pyproject.toml
        id: version
        run: |
          VERSION=$(grep '^version' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: |
            credit-risk-engine:latest
            credit-risk-engine:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Image Functionality
        run: |
          # Exercise the real endpoints. A plain "import src" passes even when
          # the model artifacts are missing from the image, which is exactly the
          # failure mode this step exists to catch.
          docker run -d --name verify -p 8000:8000 credit-risk-engine:latest

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health > /dev/null 2>&1; then
              echo "Health check passed after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::Container did not become healthy within 30s"
              docker logs verify
              docker rm -f verify
              exit 1
            fi
            sleep 1
          done

          # /health returns 503 unless the model is actually loaded, so -f is
          # enough to assert the container can serve predictions.
          curl -fsS http://localhost:8000/health | tee /dev/stderr | grep -q '"model_loaded":true'

          BODY=$(curl -fsS -X POST http://localhost:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{"person_age":35,"person_income":50000,"person_home_ownership":"OWN",
                 "person_emp_length":10,"loan_intent":"PERSONAL","loan_grade":"A",
                 "loan_amnt":5000,"loan_int_rate":11.5,"loan_percent_income":0.1,
                 "cb_person_default_on_file":0,"cb_person_cred_hist_length":8}')
          echo "$BODY"
          echo "$BODY" | grep -q '"probability_default"'

          docker rm -f verify

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push the verified image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          # Not github.sha: on workflow_run that points at the default branch
          # head, which can differ from the commit being deployed.
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Retag, never rebuild: these are the bytes the step above served a
          # prediction from.
          for TAG in "$IMAGE_TAG" "$VERSION" latest; do
            docker tag credit-risk-engine:latest "$ECR_REGISTRY/$ECR_REPOSITORY:$TAG"
            docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$TAG"
          done
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Download Active Task Definition from AWS
        run: |
          aws ecs describe-task-definition --task-definition ${{ env.ECS_TASK_DEFINITION }} --query taskDefinition > task-definition.json

      - name: Update Image in Task Definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy to Amazon ECS Fargate
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true